name: cowsay, system check and build java
on: workflow_dispatch
jobs:
  check-system-info:
    runs-on: ubuntu-latest
    steps:
      - name: "Show memory info"
        run: free -h
      - name: "Show storage info"
        run: df -TH

  install-cowsay:
    runs-on: ubuntu-latest
    needs: check-system-info
    steps:
      - name: "update ubunutu system"
        run: sudo apt update
      - name: "Install cowsay"
        run: |
          sudo apt install cowsay
          echo "*********************"
          echo "cowsay has been installed successfully"
          cowsay "Hello kitty, I love you"

  java-build:
    runs-on: ubuntu-latest
    needs: install-cowsay
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Setup java"
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          
      - name: "List source files"
        run: |
          echo "Project structure"
          find . -name "*.java" -o -name "*.gradle*" -o -name "gradlew*" | sort
          echo ""
          ls -la

      - name: "Make gradlew executable"
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            echo " Made gradlew executable"
          fi 

      - name: "Build with Gradle"
        run: ./gradlew build

      - name: "Run Java Application"
        run: ./gradlew run

      - name: "Show build artifacts"
        run: |
          echo "Build artifacts:"
          find build -name "*.jar" -type f
          echo ""
          echo "Build reports"
          ls -la build/reports/ || echo "No reports directory"

      - name: "Upload build artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-output
          path: |
            build/libs/*.jar
            build/reports/
            
          
          
          

      
          

          
