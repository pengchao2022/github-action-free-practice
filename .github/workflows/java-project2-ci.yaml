name: Java Project CI
on: 
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag'
        required: false
        default: 'latest'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ github.repository }}/java-hello-world

jobs:
  check-system-info:
    runs-on: ubuntu-latest
    steps:
      - name: Check the system info
        run: uname -a
      - name: Check memory info
        run: free -h
      - name: Check disk space
        run: df -h
  install-cowsay:
    runs-on: ubuntu-latest
    steps:
      - name: Update package lists
        run: sudo apt-get update
      - name: Install cowsay
        run: sudo apt-get install -y cowsay
      - name: Verify cowsay installation
        run: cowsay "Cowsay is installed!"

  build-java:
    needs: [install-cowsay, check-system-info]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Debug - Show Project structure
        run: |
          echo "Project Directory Structure:"
          pwd
          ls -la
          echo ""
          echo "JAVA file:"
          find . -name "*.java" -type f
          echo ""
          echo "src directory"
          ls -laR src/ || echo "can't find src"
          echo ""
          echo "Gradle privileges"
          ls -la ./gradlew || echo "can't find gradlew"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run the application
        run: ./gradlew run

      - name: Create executable JAR
        run: |
          ./gradlew jar
          echo "=== JAR files in build/libs ==="
          ls -la build/libs/
          echo ""
          echo "=== check JAR manifest ==="
          jar tf build/libs/*.jar | head -20

      - name: Get JAR file info
        id: get-jar
        run: |
          JAR_FILE=$(ls build/libs/*.jar | head -n 1)
          echo "JAR_FILE=$JAR_FILE" >> $GITHUB_ENV
          echo "JAR_SIZE=$(stat -c%s "$JAR_FILE")" >> $GITHUB_ENV
          echo "JAR_NAME=$(basename "$JAR_FILE")" >> $GITHUB_ENV

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: |
            build/libs/*.jar
            build/reports/
            build/logs/

  build-and-push-docker:
    needs: build-java
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: java-app
          path: build/libs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/java-hello-world:latest
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/java-hello-world:latest
          cache-to: type=inline

      - name: Verify Docker image
        run: |
          echo "Verifying Docker image..."
          docker images | grep "${{ secrets.DOCKER_USERNAME }}" || echo "Image not found!"

          # display docker hub info
          echo "Image pushed to:"
          echo "- ${{ env.REGISTRY}}"
          
     