name: Java Project CI
on: workflow_dispatch
jobs:
  check-system-info:
    runs-on: ubuntu-latest
    steps:
      - name: Check the system info
        run: uname -a
      - name: Check memory info
        run: free -h
      - name: Check disk space
        run: df -h
  install-cowsay:
    needs: check-system-info
    runs-on: ubuntu-latest
    steps:
      - name: Update package lists
        run: sudo apt-get update
      - name: Install cowsay
        run: sudo apt-get install -y cowsay
      - name: Verify cowsay installation
        run: cowsay "Cowsay is installed!"

  build-java:
    needs: [install-cowsay, check-system-info]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run the application
        run: ./gradlew run

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: |
            build/libs/*.jar
            build/reports/
            build/logs/
     