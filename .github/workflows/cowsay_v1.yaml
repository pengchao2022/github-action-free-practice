name: cowsay practice
on: workflow_dispatch
jobs:
  cowsay:
    runs-on: ubuntu-latest
    steps:
      - name: "Update ubuntu apt repo"
        run: sudo apt update
      - name: "Install cowsay on ubuntu"
        run: |
          sudo apt install cowsay
          echo "Installation finished"
      - name: "Show hellokitty with cowsay"
        run: cowsay "Hello kitty i love you!"

        
        
