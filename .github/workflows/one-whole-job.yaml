name: one whole job
on: workflow_dispatch
jobs:
  one-whole-job:
    runs-on: ubuntu-latest
    steps:
      - name: Update the ubuntu system
        run: sudo apt update
      - name: Check the memory
        run: free -h
      - name: Check the disk
        run: df -TH
      - name: Check the CPUs
        run: |
          echo "逻辑CPU总数: $(nproc)"
          echo "物理核心数: $(lscpu | grep 'Core(s) per socket' | awk '{print $4}')"
          echo "CPU线程数: $(lscpu | grep 'Thread(s) per core' | awk '{print $4}')"
          echo "CPU型号: $(lscpu | grep 'Model name' | cut -d: -f2 | xargs)"

      - name: Install Cowsay
        run: sudo apt install cowsay
      - name: Confirm cowsay
        run: cowsay "Cowsay has been installed successfully!"

      - name: Install figlet
        run: sudo apt install figlet
      - name: Confirm figlet
        run: figlet "Hello World 2026"

      - name: Install toilet
        run: sudo apt install toilet
      - name: Confirm toilet
        run: toilet "Hello World 2026"

      - name: Display github logo
        run: |
          echo "   _____ _ _   _    _                         _ "
          echo "  / ____(_) | | |  | |                       | |"
          echo " | |  __ _| |_| |__| | ___  _ __   ___  _ __ | |"
          echo " | | |_ | | __|  __  |/ _ \| '_ \ / _ \| '_ \| |"
          echo " | |__| | | |_| |  | | (_) | | | | (_) | | | |_|"
          echo "  \_____|_|\__|_|  |_|\___/|_| |_|\___/|_| |_(_)"

        




