name: Check ubuntu system
on: workflow_dispatch
jobs:
  check-ubuntu-system:
    runs-on: ubuntu-latest
    steps:
      - name: check the memory
        run: free -h
      - name: check the disk info
        run: df -TH
      - name: check the cpus
        run: |
          echo "逻辑CPU总数: $(nproc)"
          echo "物理核心数: $(lscpu | grep 'Core(s) per socket' | awk '{print $4}')"
          echo "CPU线程数: $(lscpu | grep 'Thread(s) per core' | awk '{print $4}')"
          echo "CPU型号: $(lscpu | grep 'Model name' | cut -d: -f2 | xargs)"

  install-cowsay:
    runs-on: ubuntu-latest
    needs: check-ubuntu-system
    steps:
      - name: Update ubuntu system
        run: sudo apt update
      - name: Install cowsay
        run: sudo apt install cowsay
      - name: confirm cowsay
        run: cowsay "Hello, My name is cowsay"

  display-art:
    runs-on: ubuntu-latest
    needs: check-ubuntu-system
    steps:
      - name: display ASCII art
        run: |
          echo "    /\_/\    "
          echo "   ( o.o )   "
          echo "    > ^ <    "
          echo "   Cat says hello!"
          echo -e "\n"


        

        
    
